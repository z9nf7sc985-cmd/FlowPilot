name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK cmdline-tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK and unit tests
        run: gradle assembleDebug test --stacktrace

      - name: Package release assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FlowPilot-v0.1.1.apk
          cp FlowPilot-v0.1.1.apk FlowPilot-debug.apk
          sha256sum FlowPilot-v0.1.1.apk | tee FlowPilot-v0.1.1.sha256
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('FlowPilot-v0.1.1.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write('FlowPilot-v0.1.1.apk')
              z.write('FlowPilot-v0.1.1.sha256')
          print('zipped')
          PY
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose FlowPilot-v0.1.1.apk | tee apksigner.txt
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging FlowPilot-v0.1.1.apk | head -5 | tee badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowPilot-debug
          path: |
            FlowPilot-v0.1.1.apk
            FlowPilot-v0.1.1.zip
            FlowPilot-v0.1.1.sha256
          if-no-files-found: error

      - name: Create GitHub Release v0.1.1
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: FlowPilot v0.1.1
          body: |
            Sideload fix for Galaxy S9+ / Android 10 ("problem parsing the package").

            **Changes**
            - Enable APK Signature Scheme **v1 + v2 + v3** (previous build was effectively verified as v2/v3-only on API 24+)
            - Remove API 34-only `foregroundServiceType=specialUse` + `<property>` from manifest
            - `extractNativeLibs=true` (legacy JNI packaging)
            - PNG mipmap launcher icons; ABI filter `armeabi-v7a` + `arm64-v8a`
            - versionCode 2 / versionName 0.1.1

            **Install**
            1. Download `FlowPilot-v0.1.1.apk` (or the zip) on the phone
            2. Verify SHA-256 against `FlowPilot-v0.1.1.sha256`
            3. Enable Install unknown apps → open the APK

            Package: `com.flowpilot.automation.debug` · minSdk 26 · targetSdk 29
          files: |
            FlowPilot-v0.1.1.apk
            FlowPilot-v0.1.1.zip
            FlowPilot-v0.1.1.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
