name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK cmdline-tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"


      - name: Restore upload keystore and launcher icons
        run: |
          base64 -d flowpilot-upload.jks.b64 > flowpilot-upload.jks
          base64 -d icons.tgz.b64 | tar xzf - -C app/src/main/res

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK and unit tests
        run: gradle assembleDebug test --stacktrace

      - name: Package release assets
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FlowPilot-v0.2.1.apk
          cp FlowPilot-v0.2.1.apk FlowPilot-debug.apk
          sha256sum FlowPilot-v0.2.1.apk | tee FlowPilot-v0.2.1.apk.sha256
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('FlowPilot-v0.2.1.zip','w',zipfile.ZIP_DEFLATED) as z:
              z.write('FlowPilot-v0.2.1.apk')
              z.write('FlowPilot-v0.2.1.apk.sha256')
          print('zipped')
          PY
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --min-sdk-version 23 FlowPilot-v0.2.1.apk | tee apksigner.txt
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging FlowPilot-v0.2.1.apk | head -5 | tee badging.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowPilot-debug
          path: |
            FlowPilot-v0.2.1.apk
            FlowPilot-v0.2.1.zip
            FlowPilot-v0.2.1.apk.sha256
          if-no-files-found: error

      - name: Create GitHub Release v0.2.1
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          name: FlowPilot v0.2.1
          body: |
            Hardening pass for Galaxy S9+ (Android 10) — fix broken wiring and MediaProjection reliability.

            **Fixes**
            - Editor reloads after Add/Edit step (no more vanishing new steps)
            - Run waits for save before starting (no race on new flows)
            - Schedule enable/disable cancels or arms AlarmManager correctly; alarms respect enabled flag
            - Import/Export JSON show success/error toasts; Export also on editor
            - Screen capture starts a foreground service first (required for stable MediaProjection on API 29)
            - Battery prompt uses one-tap REQUEST_IGNORE_BATTERY_OPTIMIZATIONS when possible
            - Image matcher recycles cropped bitmaps (memory leak fix)
            - More unit tests (region parse, BlockTree move, import id change)

            **Same signing key as v0.2.0** — installs as an update (versionCode 4 / 0.2.1-debug).

            **Install**
            1. Download `FlowPilot-v0.2.1.apk` on the phone
            2. Verify SHA-256 against `FlowPilot-v0.2.1.apk.sha256`
            3. Open the APK (updates over 0.2.0; no uninstall needed)
          files: |
            FlowPilot-v0.2.1.apk
            FlowPilot-v0.2.1.zip
            FlowPilot-v0.2.1.apk.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
